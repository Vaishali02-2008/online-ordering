
```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to your ShopEasy account.">

    <title>Login | ShopEasy</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">ShopEasy</a>
        </div>

        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li>
                    <a href="cart.html">
                        Cart <span id="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="auth-links">
            <a href="login.html" class="login-link active">Login</a>
            <a href="register.html" class="btn btn-primary">Register</a>
        </div>
    </header>

    <main class="auth-page">

        <!-- Login Form -->
        <section class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">👋</div>

                <p class="section-subtitle">WELCOME BACK</p>
                <h1>Login to ShopEasy</h1>

                <p>Enter your account details to continue shopping.</p>
            </div>

            <!-- Error and success messages -->
            <div
                id="login-message"
                class="form-message"
                role="alert"
                aria-live="polite"
                hidden
            ></div>

            <form id="login-form">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="login-button"
                    class="btn btn-primary auth-submit"
                >
                    Login
                </button>

            </form>

            <div class="auth-divider">
                <span>New to ShopEasy?</span>
            </div>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

            <p class="auth-back">
                <a href="index.html">&larr; Back to Home</a>
            </p>

        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>
                &copy; <span id="current-year"></span>
                ShopEasy. B.Tech Workshop Project.
            </p>
        </div>
    </footer>

    <script src="app.js"></script>

</body>
</html>
```
