
```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ShopEasy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <a href="index.html" class="logo">ShopEasy</a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <!-- Registration Section -->
    <main class="auth-page">
        <section class="auth-card">
            <h1>Create an Account</h1>
            <p class="section-subtitle">
                Register to start shopping with ShopEasy.
            </p>

            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                        minlength="2"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <p id="register-message" role="status" aria-live="polite"></p>

                <button
                    type="submit"
                    id="register-button"
                    class="btn btn-primary"
                >
                    Create Account
                </button>
            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

            <p class="auth-footer">
                <a href="index.html">← Back to Home</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 ShopEasy. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
```
